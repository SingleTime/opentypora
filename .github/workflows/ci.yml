name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build app bundle
        run: ./build.sh

      - name: Assert bundle
        run: |
          test -d build/OpenTypora.app
          test -x build/OpenTypora.app/Contents/MacOS/OpenTypora
          test -f build/OpenTypora.app/Contents/Resources/app/js/md.js
          codesign -dv build/OpenTypora.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            build/OpenTypora.app/Contents/Info.plist

      # 纯 Node 套件。需要 WKWebView 渲染的 harness 套件要 build/shot 起窗口，CI 里跳过。
      # cli 套件会从 Info.plist 取版本号，所以必须先把 bundle 指给 OPENTYPORA_APP。
      - name: Frontend tests
        run: node test/runall.js --node-only
        env:
          OPENTYPORA_APP: ${{ github.workspace }}/build/OpenTypora.app
